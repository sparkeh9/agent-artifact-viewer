[package]
name = "artifact-viewer"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.29"
egui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.41", features = ["full"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
pulldown-cmark = "0.12"
diff = "0.1"
uuid = { version = "1.11", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.8"

[lib]
name = "artifact_viewer"
path = "src/lib.rs"

[[bin]]
name = "artifact-viewer"
path = "src/main.rs"

[[bin]]
name = "artifact-mcp-server"
path = "src/mcp_server.rs"
